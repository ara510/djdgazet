  <!-- Thème sombre appliqué AVANT le premier rendu (évite le flash blanc au chargement). -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem('hl-theme');
        var dark = s === 'dark' || (!s && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
      } catch (e) {}
    })();
  </script>
